name = "leanweb"
version = "0.1.0"
defaultTargets = ["LeanHttp", "LeanWeb", "Example", "leanweb", "leanweb_tests", "leanweb_transport_tests"]
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_lib]]
name = "LeanHttp"

[[lean_lib]]
name = "LeanWeb"

[[lean_lib]]
name = "Example"

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "leanweb"
root = "Example.Main"

[[lean_exe]]
name = "leanweb_tests"
root = "Tests"

[[lean_exe]]
name = "leanweb_transport_tests"
root = "Tests.TransportMain"
